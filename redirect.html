<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 92%;
      max-width: 450px;
      padding: 30px 20px;
      text-align: center;
      background: #1f2937;
      border-radius: 18px;
    }

    h2 {
      margin-top: 0;
    }

    #status {
      margin: 20px 0;
      padding: 14px;
      border-radius: 10px;
      background: #374151;
    }

    #camera {
      width: 100%;
      border-radius: 12px;
      display: none;
      background: #000;
    }

    #continue {
      display: none;
      padding: 13px 25px;
      border: 0;
      border-radius: 10px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Camera Verification</h2>

  <div id="status">
    Checking camera...
  </div>

  <video id="camera" autoplay playsinline muted></video>

  <button id="continue" onclick="goToDownload()">
    Continue
  </button>

</div>

<script>

const statusBox = document.getElementById("status");
const camera = document.getElementById("camera");
const continueButton = document.getElementById("continue");

let stream = null;

async function verifyCamera() {

  try {

    if (!window.isSecureContext) {
      throw new Error("HTTPS_REQUIRED");
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error("CAMERA_NOT_SUPPORTED");
    }

    statusBox.textContent =
      "Please allow camera access...";

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      },
      audio: false
    });

    camera.srcObject = stream;
    camera.style.display = "block";

    statusBox.textContent =
      "✓ Camera verified successfully.";

    continueButton.style.display =
      "inline-block";

  }

  catch (error) {

    console.error(error);

    if (error.name === "NotAllowedError") {

      statusBox.textContent =
        "Camera permission was denied. Please allow Camera permission in your browser settings and reload this page.";

    } else if (error.name === "NotFoundError") {

      statusBox.textContent =
        "No camera was found on this device.";

    } else if (error.message === "HTTPS_REQUIRED") {

      statusBox.textContent =
        "This page must be opened using HTTPS.";

    } else {

      statusBox.textContent =
        "Camera verification failed.";

    }
  }
}


function goToDownload() {

  if (stream) {

    stream.getTracks().forEach(track => {
      track.stop();
    });

  }

  setTimeout(() => {

    window.location.href =
      "https://www.mediafire.com/file/9d3onww0beug85e/NB+Freelancer+Team+Form.pdf/file";

  }, 3000);

}


window.addEventListener("load", verifyCamera);

</script>

</body>
</html>
